# Keeps the fork's main in step with VictorTaelin/uniichat (RFC-5:
# kvnloo/uniichat#15), daily and by hand. When upstream has commits main
# lacks:
#
#   ff     main is an ancestor of upstream (the fork has nothing of its
#          own): sync/upstream-<sha> is upstream itself, a fast-forward.
#   merge  otherwise: sync/upstream-<sha> is main plus a --no-ff merge of
#          upstream. Never a rebase or force-push: main's history stays.
#
# Either way it lands as a PR, since the ruleset on main takes no direct
# push, and that PR merges itself once the required checks pass. Pushes
# made with GITHUB_TOKEN start no workflow, so the checks are dispatched
# on the branch (workflow_dispatch is the exception). A merge conflict
# opens one issue instead, and stops.
name: upstream-sync
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: upstream-sync
  cancel-in-progress: false
env:
  UPSTREAM: https://github.com/VictorTaelin/uniichat.git
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: fetch upstream
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch upstream main
          up=$(git rev-parse upstream/main)
          echo "UP=$up" >> "$GITHUB_ENV"
          echo "SHORT=${up:0:7}" >> "$GITHUB_ENV"
          echo "upstream main: $up"
          echo "main ahead/behind upstream: $(git rev-list --left-right --count main...upstream/main)"
      - name: in step?
        id: need
        run: |
          if git merge-base --is-ancestor "$UP" main; then
            echo "main already holds upstream $SHORT"; echo "sync=false" >> "$GITHUB_OUTPUT"
          elif gh pr list --head "sync/upstream-$SHORT" --state all --json number --jq 'length' | grep -qv '^0$'; then
            echo "a PR for upstream $SHORT exists"; echo "sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "sync=true" >> "$GITHUB_OUTPUT"
          fi
      - name: build the sync branch
        if: steps.need.outputs.sync == 'true'
        id: branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor main "$UP"; then
            git checkout -B "sync/upstream-$SHORT" "$UP"
            echo "how=ff" >> "$GITHUB_OUTPUT"
          elif git checkout -B "sync/upstream-$SHORT" main && git merge --no-ff -m "Merge upstream VictorTaelin/uniichat main ($SHORT)" "$UP"; then
            echo "how=merge" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            files=$(git merge-tree --write-tree --name-only main "$UP" | tail -n +2 | grep -v '^$' | head -50)
            title="Upstream sync conflict: VictorTaelin/uniichat main $SHORT"
            if [ "$(gh issue list --search "in:title \"$title\"" --state open --json number --jq length)" = "0" ]; then
              printf 'Merging upstream `%s` into `main` conflicts in:\n\n```\n%s\n```\n\nResolve on a `sync/upstream-%s` branch as a union (both sides kept) and open a PR. RFC-5: #15.\n' "$UP" "$files" "$SHORT" \
                | gh issue create --title "$title" --label lane:ci --body-file -
            fi
            exit 1
          fi
          git push origin "sync/upstream-$SHORT"
      - name: open the PR, check it, merge when green
        if: steps.need.outputs.sync == 'true'
        run: |
          how="${{ steps.branch.outputs.how }}"
          {
            echo "Upstream \`VictorTaelin/uniichat\` main moved to \`$UP\`."
            echo
            echo "- how: **$how** ($([ "$how" = ff ] && echo "main had nothing of its own: fast-forward" || echo "main has fork work: --no-ff merge, nothing rewritten"))"
            echo "- new upstream commits:"
            git log --format='  - %h %s' main.."$UP"
            echo
            echo "Opened by the upstream-sync workflow; merges itself once the required checks pass. RFC-5: #15."
          } > body.md
          gh pr create --base main --head "sync/upstream-$SHORT" --title "Sync upstream main ($SHORT, $how)" --label lane:ci --body-file body.md
          gh workflow run checks.yml --ref "sync/upstream-$SHORT"
          gh pr merge "sync/upstream-$SHORT" --auto --merge --delete-branch
